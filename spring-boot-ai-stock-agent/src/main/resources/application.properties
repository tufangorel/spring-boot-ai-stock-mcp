spring.application.name=spring-boot-ai-stock-agent

server.port=${PORT:8080}

# Chat model provider used for answers: openai or anthropic
spring.ai.model.chat=${AI_PROVIDER:openai}

# Only chat is used, so the other model auto-configurations stay off
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
spring.ai.anthropic.chat.options.temperature=0.2
spring.ai.anthropic.chat.options.max-tokens=2048

# The stock MCP server. The connection is made on the first question, so the agent starts even if the server is down.
spring.ai.mcp.client.name=spring-boot-ai-stock-agent
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.request-timeout=20s
spring.ai.mcp.client.streamable-http.connections.stocks.url=${STOCK_MCP_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,info

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

stocks.max-question-characters=500
