spring.application.name=spring-boot-ai-stock-mcp-server

# The MCP endpoint has no authentication, so it only listens on this machine.
server.port=${PORT:8081}
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.ai.mcp.server.name=spring-boot-ai-stock-mcp-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Delayed Borsa Istanbul stock data. Find a ticker with findSymbol, then use getQuote or getHistory. Every result states its source, time, and delay.

stocks.cache-ttl=60s
stocks.connect-timeout=3s
stocks.read-timeout=5s
stocks.yahoo-delay-minutes=15
stocks.max-symbols=10
stocks.max-candles=120
# Each tool call is recorded as a span, a log line, and a timer; these control its arguments and result.
stocks.record-tool-payloads=true
stocks.max-payload-characters=4000

management.endpoints.web.exposure.include=health,info,metrics

# Every request is traced. Traces leave the application only with the "otel" profile, which sets where they go.
management.tracing.sampling.probability=1.0
# Metrics stay on the Actuator endpoint; Jaeger takes traces only.
management.otlp.metrics.export.enabled=false
